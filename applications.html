<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <!-- CSS -->

    <link rel="stylesheet" href="styles.css">


</head>


<body>



<!-- ================= HEADER ================= -->


<header>


    <div class="logo">

        <h1>💼 Job Applications Tracker</h1>

    </div>



    <nav>

        <ul>


            <li>
                <a href="index.html">
                    Home
                </a>
            </li>


            <li>
                <a href="applications.html" class="active">
                    Applications
                </a>
            </li>


            <li>
                <a href="add-application.html">

                </a>
            </li>


            <li>
                <a href="about.html">
                    About
                </a>
            </li>


        </ul>

    </nav>


</header>





<!-- ================= MAIN ================= -->


<main>



<section>


    <h2 class="page-title">
        My Job Applications
    </h2>



    <!-- Search and Filter -->


    <div class="controls">


        <input 
            type="search"
            id="search"
            placeholder="Search company or position..."
        >



        <select id="statusFilter">


            <option value="All">
                All Applications
            </option>


            <option value="Applied">
                Applied
            </option>


            <option value="Interview Scheduled">
                Interview Scheduled
            </option>


            <option value="Offer Received">
                Offer Received
            </option>


            <option value="Rejected">
                Rejected
            </option>


        </select>


    </div>





    <!-- Applications Display Area -->


    <section 
        id="applicationList"
        class="application-list">


        <!-- JavaScript adds applications here -->


    </section>



</section>




</main>






<!-- ================= FOOTER ================= -->


<footer>


    <p>

        Keep your career journey organized
    </p>
